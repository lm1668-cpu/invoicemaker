<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>INVOICE PRO — 工程及室內設計單據系統</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2canvas & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans HK', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .ui-card {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid rgba(203, 213, 225, 0.8);
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }
    .ui-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13.5px;
      background-color: #f8fafc;
      transition: all 0.18s ease;
      color: #0f172a;
    }
    .ui-input:focus {
      background-color: #ffffff;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
      outline: none;
    }
    .ui-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }
    /* ==================== A4 專業發票渲染佈局 ==================== */
    .invoice-paper {
      width: 794px;
      min-height: 1122px;
      background: #ffffff;
      color: #1e293b;
      font-family: 'Inter', 'Noto Sans HK', Arial, sans-serif;
      padding: 52px 56px 46px 56px;
      box-sizing: border-box;
      position: relative;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 2px;
    }
    .inv-title {
      color: #1e3a8a;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-align: right;
      line-height: 1;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .inv-header-table {
      width: 330px;
      border-collapse: collapse;
      margin-left: auto;
      font-size: 12px;
    }
    .inv-header-table th {
      background-color: #e0f2fe;
      color: #1e3a8a;
      font-weight: 700;
      padding: 6px 12px;
      border: 1px solid #64748b;
      text-align: center;
      width: 50%;
    }
    .inv-header-table td {
      padding: 6px 12px;
      border: 1px solid #64748b;
      text-align: center;
      color: #0f172a;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 12.5px;
    }
    .inv-billto-header {
      background-color: #e0f2fe;
      border: 1px solid #64748b;
      color: #1e3a8a;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 12px;
      width: 260px;
      margin-top: 26px;
      margin-bottom: 8px;
    }
    .inv-items-box {
      margin-top: 22px;
      border: 1px solid #64748b;
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }
    .inv-items-header {
      display: flex;
      background-color: #e0f2fe;
      border-bottom: 1px solid #64748b;
      font-weight: 700;
      font-size: 12px;
      color: #1e3a8a;
    }
    .inv-items-header > div:first-child { width: 76%; padding: 7px 14px; border-right: 1px solid #64748b; }
    .inv-items-header > div:last-child { width: 24%; padding: 7px 14px; text-align: right; }
    .inv-items-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: linear-gradient(to right, transparent calc(76% - 1px), #64748b calc(76% - 1px), #64748b 76%, transparent 76%);
      padding-top: 8px;
      padding-bottom: 16px;
    }
    .inv-item-row { display: flex; font-size: 13px; line-height: 1.5; color: #1e293b; }
    .inv-item-desc { width: 76%; padding: 5px 14px; word-break: break-word; }
    .inv-item-amt { width: 24%; padding: 5px 14px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .inv-summary-footer { border-top: 1px solid #64748b; }
    .inv-summary-line { display: flex; border-bottom: 1px solid #cbd5e1; font-size: 12.5px; background-color: #f8fafc; }
    .inv-summary-line > div:first-child { width: 76%; padding: 6px 14px; text-align: right; font-weight: 600; border-right: 1px solid #64748b; }
    .inv-summary-line > div:last-child { width: 24%; padding: 6px 14px; text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .inv-total-line { display: flex; background-color: #e0f2fe; font-size: 14.5px; font-weight: 800; color: #1e3a8a; }
    .inv-total-line > div:first-child { width: 76%; padding: 9px 14px; text-align: right; border-right: 1px solid #64748b; }
    .inv-total-line > div:last-child { width: 24%; padding: 9px 14px; text-align: right; font-family: 'JetBrains Mono', monospace; }
    .paid-stamp {
      position: absolute; top: 40%; right: 11%;
      border: 4px solid rgba(5, 150, 105, 0.8); outline: 2px solid rgba(5, 150, 105, 0.8); outline-offset: -7px;
      color: rgba(5, 150, 105, 0.85); font-size: 44px; font-weight: 900; padding: 8px 28px; border-radius: 8px;
      transform: rotate(-14deg); letter-spacing: 5px; pointer-events: none; text-transform: uppercase; z-index: 20; background-color: rgba(255, 255, 255, 0.15);
    }
    .preview-scale-wrapper { width: 100%; overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start; }
    @media print {
      body * { visibility: hidden; }
      #invoice-print-area, #invoice-print-area * { visibility: visible; }
      #invoice-print-area { position: fixed; left: 0; top: 0; width: 100%; box-shadow: none !important; transform: scale(1) !important; }
    }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- ==================== PIN 密碼鎖保護層 ==================== -->
  <div id="pin-lock-overlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-xs w-full p-7 text-center space-y-4 shadow-2xl border border-slate-100">
      <div class="w-14 h-14 bg-gradient-to-br from-blue-700 to-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-blue-500/30">🔒</div>
      <div>
        <h2 class="text-lg font-extrabold text-slate-900">INVOICE PRO</h2>
        <p class="text-xs text-slate-500 mt-0.5">預設解鎖密碼：<span class="font-mono font-bold text-emerald-600">1668</span></p>
      </div>
      <input type="password" id="pin-input" inputmode="numeric" placeholder="請輸入密碼" 
        onkeydown="if(event.key==='Enter') verifyPin()"
        class="w-full border-2 border-slate-200 bg-slate-50 rounded-2xl px-4 py-3 text-center text-xl font-bold tracking-[0.4em] focus:border-emerald-600 focus:bg-white outline-none transition" />
      <p id="pin-error" class="text-xs text-red-500 font-medium hidden">❌ 密碼不正確，請重試（預設 1668）</p>
      <button onclick="verifyPin()" class="w-full bg-gradient-to-r from-blue-900 to-emerald-600 hover:from-blue-800 hover:to-emerald-500 text-white font-bold py-3 rounded-2xl shadow-lg shadow-emerald-600/25 transition active:scale-[0.98]">
        解鎖進入系統
      </button>
    </div>
  </div>

  <!-- 頂部導航欄 -->
  <header class="bg-blue-950 text-white sticky top-0 z-40 shadow-xl border-b border-blue-900">
    <div class="max
